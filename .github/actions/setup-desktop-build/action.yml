name: 准备桌面端构建环境
description: 安装 ButvanAgent 桌面端打包所需的 Node、Rust、JDK、Maven 与系统依赖。
runs:
  using: composite
  steps:
    - name: 安装 pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: agent-frontend/pnpm-lock.yaml

    - name: 安装 Rust 工具链
      uses: dtolnay/rust-toolchain@stable

    - name: 安装 JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    - name: 安装 Maven
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install maven
        elif [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update && sudo apt-get install -y maven
        else
          choco install maven -y --no-progress
        fi

    - name: 安装 Linux 系统依赖
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

    - name: 安装前端依赖
      shell: bash
      working-directory: agent-frontend
      run: pnpm install --frozen-lockfile
