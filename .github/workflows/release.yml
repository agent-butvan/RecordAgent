name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: 创建草稿 Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenAgent-Van ${{ github.ref_name }}
          body: |
            ## 构建产物

            - 桌面端：macOS（dmg/app）、Linux（AppImage/deb）、Windows（msi/nsis）
            - 应用已内嵌后端（Tauri sidecar），无需单独下载后端 jar
          draft: true
          generate_release_notes: true

  publish-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent-frontend/pnpm-lock.yaml

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # 后端 sidecar 打包需要 JDK 21（jlink/jdeps）与 Maven
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 安装 Maven
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install maven
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y maven
          else
            choco install maven -y --no-progress
          fi

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装前端依赖
        working-directory: agent-frontend
        run: pnpm install --frozen-lockfile

      # beforeBuildCommand 会自动执行后端 sidecar 打包 + 前端构建，
      # tauri-action 负责把 .dmg/.app、AppImage/.deb 上传到草稿 Release
      - name: 构建桌面安装包并上传
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: agent-frontend
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: OpenAgent-Van ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # macOS 正式分发需要签名与公证，可将证书配置为仓库 Secrets 后启用：
      # env:
      #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #   APPLE_ID: ${{ secrets.APPLE_ID }}
      #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
