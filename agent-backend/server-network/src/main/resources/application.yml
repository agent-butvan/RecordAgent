server:
  port: 8081
  shutdown: graceful

spring:
  servlet:
    multipart:
      # 全局入口覆盖当前最大的备份导入需求，各业务接口仍执行自身的文件大小校验。
      max-file-size: 512MB
      max-request-size: 520MB
  lifecycle:
    timeout-per-shutdown-phase: 5s
  config:
    import:
      - classpath:application-vendor.yml

# 飞书 SDK 的 INFO 断连日志包含带临时凭证的完整 WebSocket URL，禁止输出。
logging:
  level:
    com.lark.oapi.ws.Client: WARN
